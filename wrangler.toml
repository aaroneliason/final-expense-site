# Cloudflare Pages project config (project olive-tree-insurance → https://olive-tree-insurance.pages.dev).
# Preview deploy: npm run deploy:preview
name = "olive-tree-insurance"
pages_build_output_dir = "./dist"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "LEADS_DB"
database_name = "fe-leads"
database_id = "f273fdbf-092a-4934-a110-3dd6bade6ea8" # fe-leads, created 2026-11-06 (ENAM), schema.sql applied

[vars]
# Comma-separated state codes Aaron is licensed in (mirrors src/config/site.ts).
ALLOWED_STATES = "FL,LA,MD,MN,MO,MS,SC,VA,WA,WI"

# Secrets (never commit): set with `npx wrangler pages secret put NAME`
#   TURNSTILE_SECRET       Cloudflare Turnstile secret key
#   NOTIFY_WEBHOOK_URL     optional: POST each lead here (e.g. Aaron OS prospects endpoint)
#   NOTIFY_WEBHOOK_TOKEN   optional: bearer token for that webhook
#   RESEND_API_KEY         optional: email alert via Resend
#   NOTIFY_EMAIL_TO        e.g. the insurance inbox
#   NOTIFY_EMAIL_FROM      e.g. leads@<domain> (verified in Resend)
#   TELEGRAM_BOT_TOKEN     instant lead/review alerts to Aaron's phone (Telegram bot)
#   TELEGRAM_CHAT_ID       Aaron's Telegram chat id
#   OPENPHONE_API_KEY      confirmation text to each new lead (OpenPhone API key)
#   OPENPHONE_FROM         the site's OpenPhone number (+1XXXXXXXXXX) or its id (PN…)
