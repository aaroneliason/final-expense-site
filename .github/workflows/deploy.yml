# Build on every push; deploy to Cloudflare Pages (project olive-tree-insurance) once the
# CLOUDFLARE_API_TOKEN repo secret exists. main → https://olive-tree-insurance.pages.dev,
# other branches → https://<branch>.olive-tree-insurance.pages.dev. Preview builds are noindex.
name: Build and deploy preview

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Launch gate (report only; preview builds stay noindex)
        run: npm run check:publish || true
      - name: "Build (preview mode: noindex, robots blocked)"
        run: npm run build
        env:
          SITE_URL: https://olive-tree-insurance.pages.dev
      - name: Deploy to Cloudflare Pages
        if: env.CF_TOKEN != '' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist --project-name olive-tree-insurance --branch ${{ github.ref_name }} --commit-hash ${{ github.sha }} --commit-dirty=true
